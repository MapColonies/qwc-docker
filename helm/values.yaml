qwc-api-gateway:
  enabled: true
  fullnameOverride: qwc-api-gateway
  image:
    repository: nginxinc/nginx-unprivileged
    tag: stable
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
    port: 80
    targetPort: 8080
  ingress:
    enabled: false
    className: ''
    host: ''
    path: /
    pathType: Prefix
  route:
    enabled: true
    host: ''
    path: /
    wildcardPolicy: None
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  extraVolumes:
    - name: nginx-config
      configMap:
        name: qwc-api-gateway-nginx
  extraVolumeMounts:
    - name: nginx-config
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: nginx.conf
      readOnly: true
