global:
  cloudProvider:
    dockerRegistryUrl: ''
    imagePullSecretName: ''
  jwt:
    createSecret: true
    secretKey: '' # auto generated if not setted
  commonEnv:
    - name: JWT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: qwc-jwt
          key: JWT_SECRET_KEY
    - name: JWT_COOKIE_SAMESITE
      value: Strict
    - name: JWT_COOKIE_SECURE
      value: 'True'
  sharedStorage:
    existingClaim: shared-ingestion-source
    create: false
    size: 20Gi
    storageClassName: ''
x-pull-policy: IfNotPresent
x-tag-lts: latest-2025-lts
x-svc-9090: &id003
  enabled: true
  type: ClusterIP
  port: 9090
  targetPort: 9090
x-jwt-secret-env: &id005
  name: JWT_SECRET_KEY
  valueFrom:
    secretKeyRef:
      name: qwc-jwt
      key: JWT_SECRET_KEY
x-jwt-cookie-csrf-true-env: &id004
  name: JWT_COOKIE_CSRF_PROTECT
  value: 'True'
x-jwt-cookie-csrf-false-env: &id006
  name: JWT_COOKIE_CSRF_PROTECT
  value: 'False'
x-jwt-cookie-samesite-env: &id007
  name: JWT_COOKIE_SAMESITE
  value: Strict
x-jwt-cookie-secure-env: &id008
  name: JWT_COOKIE_SECURE
  value: 'True'
x-uwsgi-command: &id001
  - /bin/sh
  - -c
x-uwsgi-args: &id002
  - 'HOME=/tmp uwsgi --http-socket :9090 --buffer-size
    $REQ_HEADER_BUFFER_SIZE --processes $UWSGI_PROCESSES --threads
    $UWSGI_THREADS --plugins python3 $UWSGI_EXTRA --protocol uwsgi
    --wsgi-disable-file-wrapper --master --chdir /srv/qwc_service --virtualenv
    /srv/qwc_service/.venv --mount $SERVICE_MOUNTPOINT=server:app
    --manage-script-name

    '
qwc-postgis:
  enabled: false
  fullnameOverride: qwc-postgis
  image:
    repository: sourcepole/qwc-base-db
    tag: '16'
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
    port: 5432
    targetPort: 5432
  env:
    - name: POSTGRES_PASSWORD
      value: ''
  sharedStorage:
    subPaths:
      dbData: vector/qwc-storage/db
      demoDataSetupScript: vector/qwc-storage/demo-data/setup-demo-data.sh
qwc-config-db-migrate:
  enabled: false
  fullnameOverride: qwc-config-db-migrate
  image:
    repository: sourcepole/qwc-base-db-migrate
    tag: latest-2025-lts
    pullPolicy: IfNotPresent
  sharedStorage:
    subPaths:
      pgServiceConf: vector/qwc-storage/pg_service.conf
      demoDataPermissionsScript: vector/qwc-storage/demo-data/setup-demo-data-permissions.sh
qwc-qgis-server:
  enabled: true
  fullnameOverride: qwc-qgis-server
  image:
    repository: nivgreen/qwc-qgis-server
    tag: 3.40-openshift
    pullPolicy: IfNotPresent
  service:
    enabled: true
    type: ClusterIP
    port: 8080
    targetPort: 8080
  env:
    - name: PORT
      value: '8080'
    - name: FCGID_EXTRA_ENV
      value: "PRINT_LAYOUT_DIR,QGIS_AUTH_DB_DIR_PATH,QGIS_AUTH_PASSWORD_FILE,SSL_CERT_DIR"
    - name: PRINT_LAYOUT_DIR
      value: "/layouts"
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/usr/local/share/ca-certificates/custom
    - name: QGIS_AUTH_DB_DIR_PATH
      value: /var/lib/qgis
    - name: QGIS_AUTH_PASSWORD_FILE
      value: /var/lib/qgis/qgis-auth.txt
  extraVolumes:
    - name: external-ca-certs
      configMap:
        name: qgis-extra-cas
  extraVolumeMounts:
    - name: external-ca-certs
      mountPath: /usr/local/share/ca-certificates/custom
      readOnly: true
  qgisAuthFiles:
    enabled: true
    secretName: qgis-auth-files
    dbKey: qgis-auth.db
    txtKey: qgis-auth.txt
    dbFilePath: files/qgis-auth/qgis-auth.db
    masterKey: '123456'
  sharedStorage:
    subPaths:
      qgsResources: vector/qwc-storage/qgs-resources
      printLayouts: vector/qwc-storage/print-layouts
      pgServiceConf: vector/qwc-storage/pg_service.conf
      pluginPrintTemplates: vector/qwc-storage/qgis-server-plugins/print_templates
      pluginSplitCategorized: vector/qwc-storage/qgis-server-plugins/split_categorized
      pluginFilterGeom: vector/qwc-storage/qgis-server-plugins/filter_geom
      pluginClearCapabilities: vector/qwc-storage/qgis-server-plugins/clear_capabilities
qwc-config-service:
  enabled: true
  fullnameOverride: qwc-config-service
  image:
    repository: sourcepole/qwc-config-generator
    tag: latest-2025-lts
    pullPolicy: IfNotPresent
  command: *id001
  args: *id002
  service: *id003
  env:
    - *id004
    - name: INPUT_CONFIG_PATH
      value: /srv/qwc_service/config-in
    - name: OUTPUT_CONFIG_PATH
      value: /srv/qwc_service/config-out
    - name: GENERATE_DYNAMIC_KVRELS
      value: '1'
  sharedStorage:
    subPaths:
      configIn: vector/qwc-storage/config-in
      configOut: vector/qwc-storage/config
      qwc2: vector/qwc-storage/qwc2
      qgsResources: vector/qwc-storage/qgs-resources
      pgServiceConf: vector/qwc-storage/pg_service.conf
      printLayouts: vector/qwc-storage/print-layouts
      reports: vector/qwc-storage/reports
