{{- if .Values.enabled }}
{{- $name := include "qwc-service.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
    spec:
      restartPolicy: OnFailure
      {{- if .Values.global.cloudProvider.imagePullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.global.cloudProvider.imagePullSecretName }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "qwc-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- $env := concat .Values.global.commonEnv .Values.env }}
            {{- toYaml $env | nindent 12 }}
          {{- if or .Values.sharedStorage.subPaths .Values.extraVolumeMounts }}
          volumeMounts:
            - name: shared-storage
              mountPath: /tmp/pg_service.conf
              subPath: {{ .Values.sharedStorage.subPaths.pgServiceConf }}
              readOnly: true
            - name: shared-storage
              mountPath: /tmp/extra-init.d/setup-demo-data-permissions.sh
              subPath: {{ .Values.sharedStorage.subPaths.demoDataPermissionsScript }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.sharedStorage.subPaths .Values.extraVolumes }}
      volumes:
        {{- if .Values.sharedStorage.subPaths }}
        - name: shared-storage
          persistentVolumeClaim:
            claimName: {{ include "qwc-service.sharedPvc" $ }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
