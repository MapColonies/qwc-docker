enabled: true
fullnameOverride: ''
replicaCount: 1
image:
  repository: ''
  tag: latest
  pullPolicy: IfNotPresent
service:
  enabled: true
  type: ClusterIP
  port: 9090
  targetPort: 9090
env: []
command: []
args: []
resources: {}
podAnnotations: {}
extraVolumes: []
extraVolumeMounts: []
sharedStorage:
  subPaths: {}
configMap:
  enabled: true
  data:
    nginx.conf: |
      server {
          listen 8080;
          server_name localhost;

          proxy_read_timeout 90;
          client_max_body_size 10M;

          proxy_redirect off;
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;

          location /api/v1/data { proxy_pass http://qwc-data-service:9090; }
          location /api/v1/document { proxy_pass http://qwc-document-service:9090; }
          location /api/v1/elevation { proxy_pass http://qwc-elevation-service:9090; }
          location /api/v1/featureinfo { proxy_pass http://qwc-feature-info-service:9090; }
          location /api/v1/legend { proxy_pass http://qwc-legend-service:9090; }
          location /api/v1/mapinfo/ { proxy_pass http://qwc-mapinfo-service:9090; }
          location /api/v1/permalink { proxy_pass http://qwc-permalink-service:9090; }
          location /api/v1/print { proxy_pass http://qwc-print-service:9090; }
          location /api/v2/search { proxy_pass http://qwc-fulltext-search-service:9090; }
          location /qwc_admin { proxy_pass http://qwc-admin-gui:9090; }
          location /auth/ { proxy_pass http://qwc-auth-service:9090; }
          location /ows { proxy_pass http://qwc-ogc-service:9090; }
          location / { proxy_pass http://qwc-map-viewer:9090; }
      }
ingress:
  enabled: false
  className: ''
  host: ''
  path: /
  pathType: Prefix
route:
  enabled: false
  host: ''
  path: /
  wildcardPolicy: None
  tls:
    enabled: false
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
